name: PostHog live check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: npm i --no-save playwright@1.47.2 && npx playwright install chromium >/dev/null
      - run: |
          cat > c.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch(); const p = await b.newPage(); const hits = [];
          p.on("request", (r) => { if (/posthog\.com/.test(r.url())) hits.push(r.method() + " " + r.url().split("?")[0]); });
          await p.goto("https://www.orbitalpha.cloud/stocks/rklb?ref=x", { waitUntil: "networkidle" });
          await p.waitForTimeout(4000);
          await p.evaluate(() => window.posthog?.capture?.("setup_check", { by: "claude" }));
          await p.waitForTimeout(4000);
          const loaded = await p.evaluate(() => !!window.posthog?.__loaded);
          const cookies = (await p.context().cookies()).filter((c) => /ph_/.test(c.name)).length;
          console.log(`::notice::loaded=${loaded} posthog_requests=${hits.length} ph_cookies=${cookies} first=${hits.slice(0,3).join(" | ")}`);
          await b.close();
          JS
          node c.mjs
