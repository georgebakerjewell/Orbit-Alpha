name: Social screenshots
on:
  push:
    branches: [x-shots]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/screenshots.mjs
      - name: Push screenshots to x-shots-out
        run: |
          cd shots
          git init -q && git checkout -q -b x-shots-out
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "screenshots $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" x-shots-out
