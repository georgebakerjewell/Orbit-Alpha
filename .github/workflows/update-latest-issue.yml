name: Update latest newsletter issue

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Beehiiv RSS for a new issue
        run: node scripts/update-issue.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "orbit-alpha-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add src/issues.json
            git commit -m "chore: update latest issue from Beehiiv RSS"
            git push
          fi
