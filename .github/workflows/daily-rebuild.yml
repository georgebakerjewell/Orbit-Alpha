name: Daily rebuild for search engines

# Rebuilds the site once each weekday after the US close, so the prices, filings and contracts
# baked into the static pages (scripts/prerender.mjs) and the sitemap dates stay current.
# Needs a Vercel Deploy Hook URL saved as the repo secret VERCEL_DEPLOY_HOOK
# (Vercel > Project > Settings > Git > Deploy Hooks, branch main). Does nothing until it is set.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 22 * * 1-5" # 10:30pm UTC, after the US market close

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK not set, skipping."; exit 0; fi
          curl -fsS -X POST "$HOOK"
