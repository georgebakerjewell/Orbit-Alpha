name: X post every 2 hours (market hours)

# Every 2 hours during US market hours (9:30am - 4pm EST / 1:30pm - 8pm UTC)
# Runs at 15 minutes past to avoid conflicts with other jobs
on:
  schedule:
    - cron: "15 13,15,17,19,21,23,1,3 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build the text but do not post"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Post to X
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/x-post-2h.mjs
