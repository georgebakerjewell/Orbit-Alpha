name: Temp fin dump
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fin-dump.mjs
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git checkout --orphan fin-debug && git rm -rq --cached . 
          echo '{"git":{"deploymentEnabled":false},"ignoreCommand":"exit 0"}' > vercel.json
          git add debug vercel.json && git commit -qm dump && git push -f origin fin-debug
