name: X news tweet (from queue)

# The 2-hourly Orbit Alpha news task commits a tweet to x-queue/pending/.
# This posts it to X and moves it to x-queue/posted/.
on:
  push:
    branches: [main]
    paths: ["x-queue/pending/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print queued tweets without posting"
        type: boolean
        default: true

concurrency: { group: x-news-post, cancel-in-progress: false }
permissions: { contents: write }

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Post queued tweets
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/x-post-queue.mjs
      - name: Move posted files
        if: always()
        run: |
          git config user.name "orbit-alpha-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A x-queue
          git diff --cached --quiet || (git commit -m "Mark queued tweets as posted [skip ci]" && git pull --rebase && git push)
