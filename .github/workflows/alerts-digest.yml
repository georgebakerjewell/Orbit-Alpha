name: Daily alerts digest

# Builds the daily company digest from the live site's data.
#   preview mode: writes sample emails (and the raw data) to the alerts-preview branch, sends nothing.
on:
  workflow_dispatch:
    inputs:
      mode: { description: "preview or send", default: "preview" }
      tickers: { description: "Preview: followed tickers (comma list, or ALL)", default: "RKLB,ASTS,SPCX,PL,ETL" }

permissions: { contents: write }
concurrency: { group: alerts-digest, cancel-in-progress: false }

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build digest
        env:
          MODE: ${{ inputs.mode }}
          TICKERS: ${{ inputs.tickers }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
        run: node scripts/alerts-digest.mjs
      - name: Publish preview
        if: inputs.mode == 'preview'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd out/alerts && git init -q -b alerts-preview && git config user.name orbit-alpha-bot && git config user.email actions@users.noreply.github.com
          git add -A && git commit -qm "Alerts preview $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" alerts-preview
